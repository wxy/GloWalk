name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build & test
        run: |
          xcodebuild test \
            -project GloWalk.xcodeproj \
            -scheme GloWalk \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
