name: PR checks

# "on" is quoted to avoid YAML 1.1 parsers reading it as the boolean true.
"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  basic:
    name: Basic checks (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trailing whitespace and merge-conflict markers — the cheapest hygiene
      # signal a reviewer shouldn't have to point out.
      - name: Whitespace and conflict markers
        # The vendored SIL OFL texts keep their upstream bytes (incl. CRLF /
        # trailing spaces in the official files), so exclude them here.
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD -- . ':(exclude)GloWalk/Resources/Licenses/**'

      - name: PR description present
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').trim();
            if (body.length < 10) {
              core.setFailed(
                'Please add a PR description (at least 10 characters). ' +
                'It gives reviewers and the changelog context for the change.'
              );
            }

      - name: Conventional commit prefixes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # --no-merges: on a pull_request event the checkout is the auto-generated
          # merge commit ("Merge <sha> into <sha>"), which has no conventional prefix.
          bad="$(git log --no-merges --format=%s "$base"..HEAD \
            | grep -Ev '^(feat|fix|chore|docs|refactor|test|perf|style|ci|build|revert)(\([^)]+\))?!?: ' \
            || true)"
          if [ -n "$bad" ]; then
            echo "Commit subjects must use a conventional prefix: feat|fix|chore|docs|refactor|test|perf|style|ci|build|revert"
            echo "See CONTRIBUTING.md for the commit convention."
            printf '%s\n' "$bad"
            exit 1
          fi
