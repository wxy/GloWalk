<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">GloWalk: Path of Light</title>
  <desc id="heroDesc">A smart flashlight that reads the night — five sensors, one gentle glow. Night walk records sync to Apple Health.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0A08"/>
      <stop offset="0.55" stop-color="#120E08"/>
      <stop offset="1" stop-color="#191307"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC75F" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFC75F" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFC75F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A1E"/>
      <stop offset="0.4" stop-color="#FFD27D"/>
      <stop offset="0.75" stop-color="#FFC75F"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <circle cx="700" cy="240" r="340" fill="url(#amberGlow)"/>

  <!-- stars -->
  <g fill="#FFE9B8">
    <circle cx="150" cy="90" r="1.4" opacity="0.55"/>
    <circle cx="262" cy="142" r="1.0" opacity="0.35"/>
    <circle cx="382" cy="78" r="1.6" opacity="0.6"/>
    <circle cx="520" cy="120" r="1.0" opacity="0.3"/>
    <circle cx="660" cy="68" r="1.4" opacity="0.55"/>
    <circle cx="800" cy="112" r="1.0" opacity="0.3"/>
    <circle cx="940" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="1010" cy="160" r="1.1" opacity="0.4"/>
    <circle cx="70" cy="222" r="1.0" opacity="0.3"/>
    <circle cx="180" cy="300" r="1.3" opacity="0.45"/>
    <circle cx="96" cy="382" r="1.0" opacity="0.25"/>
    <circle cx="1216" cy="300" r="1.3" opacity="0.5"/>
    <circle cx="1232" cy="196" r="1.0" opacity="0.35"/>
    <circle cx="1120" cy="382" r="1.2" opacity="0.4"/>
    <circle cx="982" cy="420" r="1.0" opacity="0.3"/>
    <circle cx="766" cy="432" r="1.1" opacity="0.35"/>
    <circle cx="60" cy="120" r="1.5" opacity="0.5"/>
  </g>
  <g fill="#FFE9B8">
    <path d="M480 83 L481.6 88.4 L487 90 L481.6 91.6 L480 97 L478.4 91.6 L473 90 L478.4 88.4 Z" opacity="0.9"/>
    <path d="M862 133 L863.6 138.4 L869 140 L863.6 141.6 L862 147 L860.4 141.6 L855 140 L860.4 138.4 Z" opacity="0.7"/>
    <path d="M1215 63 L1216.6 68.4 L1222 70 L1216.6 71.6 L1215 77 L1213.4 71.6 L1208 70 L1213.4 68.4 Z" opacity="0.8"/>
  </g>

  <!-- moon -->
  <circle cx="1180" cy="180" r="56" fill="#FFD27D" opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="1180" cy="180" r="44" fill="#FFD98C"/>
  <circle cx="1196" cy="170" r="38" fill="#191307"/>
  <circle cx="1140" cy="170" r="4" fill="#E8B968" opacity="0.6"/>
  <circle cx="1158" cy="196" r="2.6" fill="#E8B968" opacity="0.5"/>

  <!-- constellation path -->
  <path d="M 270 412 C 380 396 420 350 520 344 C 660 336 680 292 820 284 C 950 277 1020 244 1130 238"
        fill="none" stroke="url(#pathGrad)" stroke-width="7" stroke-linecap="round" opacity="0.55" filter="url(#softGlow)"/>
  <path d="M 270 412 C 380 396 420 350 520 344 C 660 336 680 292 820 284 C 950 277 1020 244 1130 238"
        fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- path points -->
  <g>
    <circle cx="520" cy="344" r="8" fill="#FFC75F" opacity="0.35" filter="url(#bigGlow)"/>
    <circle cx="520" cy="344" r="4.5" fill="#FFD98C"/>
    <circle cx="520" cy="344" r="1.8" fill="#FFF6E0"/>
    <circle cx="820" cy="284" r="8" fill="#FFC75F" opacity="0.35" filter="url(#bigGlow)"/>
    <circle cx="820" cy="284" r="4.5" fill="#FFD98C"/>
    <circle cx="820" cy="284" r="1.8" fill="#FFF6E0"/>
    <circle cx="1130" cy="238" r="8" fill="#FFC75F" opacity="0.35" filter="url(#bigGlow)"/>
    <circle cx="1130" cy="238" r="4.5" fill="#FFD98C"/>
    <circle cx="1130" cy="238" r="1.8" fill="#FFF6E0"/>
  </g>

  <!-- flashlight glow orb -->
  <circle cx="250" cy="430" r="44" fill="#FFC75F" opacity="0.16" filter="url(#bigGlow)"/>
  <circle cx="250" cy="430" r="28" fill="#FFC75F" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="250" cy="430" r="14" fill="#FFD98C" filter="url(#softGlow)"/>
  <circle cx="250" cy="430" r="6.5" fill="#FFF6E0"/>

  <!-- title -->
  <text x="72" y="128" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#FFD98C" letter-spacing="1">GloWalk</text>
  <text x="77" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" letter-spacing="6" fill="#C9943F">PATH OF LIGHT · 随行路灯</text>
  <text x="77" y="214" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#F0C77E">A smart flashlight that reads the night</text>
  <text x="77" y="250" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9C7C48">Five sensors, one gentle glow · 五维感知，一束柔光</text>

  <!-- version / health pill -->
  <g transform="translate(900,60)">
    <rect width="320" height="40" rx="20" fill="#FFC75F" opacity="0.08" stroke="#FFC75F" stroke-opacity="0.35"/>
    <text x="20" y="26" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#FFD98C">v1.1.0 · APPLE HEALTH SYNC</text>
  </g>

  <!-- sensor chips -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#E8C48A">
    <g transform="translate(305,424)">
      <rect width="126" height="40" rx="20" fill="#FFC75F" opacity="0.07" stroke="#FFC75F" stroke-opacity="0.35"/>
      <g fill="#FFD98C">
        <circle cx="26" cy="20" r="7"/>
        <g stroke="#FFD98C" stroke-width="1.6" stroke-linecap="round">
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(0 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(45 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(90 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(135 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(180 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(225 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(270 26 20)"/>
          <line x1="26" y1="8.5" x2="26" y2="5" transform="rotate(315 26 20)"/>
        </g>
      </g>
      <text x="44" y="25">Ambient</text>
    </g>
    <g transform="translate(441,424)">
      <rect width="126" height="40" rx="20" fill="#FFC75F" opacity="0.07" stroke="#FFC75F" stroke-opacity="0.35"/>
      <rect x="19" y="10" width="13" height="20" rx="2.5" transform="rotate(-22 26 20)" fill="#FFD98C"/>
      <text x="44" y="25">Posture</text>
    </g>
    <g transform="translate(577,424)">
      <rect width="126" height="40" rx="20" fill="#FFC75F" opacity="0.07" stroke="#FFC75F" stroke-opacity="0.35"/>
      <ellipse cx="26" cy="20" rx="11" ry="6.5" fill="#FFD98C"/>
      <circle cx="26" cy="20" r="2.8" fill="#191307"/>
      <text x="44" y="25">Dark Adapt</text>
    </g>
    <g transform="translate(713,424)">
      <rect width="126" height="40" rx="20" fill="#FFC75F" opacity="0.07" stroke="#FFC75F" stroke-opacity="0.35"/>
      <circle cx="26" cy="20" r="8.5" fill="#FFD98C"/>
      <circle cx="30.5" cy="16.5" r="8" fill="#191307"/>
      <text x="44" y="25">Moon</text>
    </g>
    <g transform="translate(849,424)">
      <rect width="126" height="40" rx="20" fill="#FFC75F" opacity="0.07" stroke="#FFC75F" stroke-opacity="0.35"/>
      <circle cx="20" cy="20" r="4.6" fill="#FFD98C"/>
      <circle cx="25.5" cy="16.5" r="5.6" fill="#FFD98C"/>
      <circle cx="31" cy="20.5" r="4.2" fill="#FFD98C"/>
      <rect x="16.5" y="20.5" width="18" height="8" rx="4" fill="#FFD98C"/>
      <text x="44" y="25">Weather</text>
    </g>
  </g>
</svg>
