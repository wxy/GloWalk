<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">GloWalk — 随行路灯 · Path of Light</title>
  <desc id="heroDesc">浅色 hero：左侧为产品名与中英双语标语，右侧为应用图标、金色星座路径、光晕、脚印、月牙与星星。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#F1EBDD"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2B2620" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0C75F" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#F0C75F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F0C75F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B2E"/>
      <stop offset="0.5" stop-color="#E8A24B"/>
      <stop offset="0.85" stop-color="#F0C75F"/>
      <stop offset="1" stop-color="#F6D98A"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <linearGradient id="iconGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="0.8" stop-color="#FFD98C"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <filter id="iconGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <circle cx="800" cy="280" r="300" fill="url(#warmGlow)"/>

  <!-- divider between title block and illustration -->
  <line x1="512" y1="44" x2="512" y2="438" stroke="#2B2620" stroke-opacity="0.10"/>

  <!-- stars -->
  <g fill="#2B2620">
    <circle cx="580" cy="120" r="1.5" opacity="0.35"/>
    <circle cx="640" cy="200" r="1.1" opacity="0.22"/>
    <circle cx="700" cy="96" r="1.4" opacity="0.3"/>
    <circle cx="880" cy="120" r="1.2" opacity="0.25"/>
    <circle cx="1110" cy="190" r="1.5" opacity="0.32"/>
    <circle cx="1200" cy="260" r="1.2" opacity="0.2"/>
    <circle cx="1230" cy="120" r="1.4" opacity="0.3"/>
    <circle cx="560" cy="420" r="1.1" opacity="0.2"/>
    <circle cx="1220" cy="410" r="1.3" opacity="0.24"/>
    <circle cx="1120" cy="330" r="1.2" opacity="0.25"/>
  </g>
  <!-- sparkles -->
  <g fill="#D98E2B">
    <path d="M820 176 L821.6 181.4 L827 183 L821.6 184.6 L820 190 L818.4 184.6 L813 183 L818.4 181.4 Z"/>
    <path d="M1112 120 L1113.6 125.4 L1119 127 L1113.6 128.6 L1112 134 L1110.4 128.6 L1105 127 L1110.4 125.4 Z" opacity="0.8"/>
    <path d="M596 136 L597.6 141.4 L603 143 L597.6 144.6 L596 150 L594.4 144.6 L589 143 L594.4 141.4 Z" opacity="0.65"/>
    <path d="M1146 236 L1147.6 241.4 L1153 243 L1147.6 244.6 L1146 250 L1144.4 244.6 L1139 243 L1144.4 241.4 Z" opacity="0.55"/>
  </g>

  <!-- moon -->
  <circle cx="1170" cy="70" r="38" fill="#E8A24B" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="1170" cy="70" r="24" fill="#FFF9E8" stroke="#2B2620" stroke-width="3.5"/>
  <circle cx="1160" cy="62" r="3.5" fill="#E8C48A"/>
  <circle cx="1178" cy="78" r="2.5" fill="#E8C48A"/>

    <!-- app icon (vector) with rounded corners -->
  <g transform="translate(900,96)">
    <rect x="6" y="8" width="176" height="176" rx="40" fill="#2B2620" opacity="0.13"/>
    <rect x="0" y="0" width="176" height="176" rx="40" fill="#0C0B09"/>
    <path d="M 34 132 C 58 128 70 108 84 92 C 100 74 108 58 124 48 C 136 40 146 40 152 44"
          fill="none" stroke="#D4AF37" stroke-width="22" stroke-linecap="round" opacity="0.35" filter="url(#iconGlow)"/>
    <path d="M 34 132 C 58 128 70 108 84 92 C 100 74 108 58 124 48 C 136 40 146 40 152 44"
          fill="none" stroke="url(#iconGold)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 34 132 C 58 128 70 108 84 92 C 100 74 108 58 124 48 C 136 40 146 40 152 44"
          fill="none" stroke="#FFE9B8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="46" cy="127" r="4.5" fill="#FFD98C"/>
    <circle cx="60" cy="117" r="3" fill="#E8A24B" opacity="0.9"/>
    <circle cx="84" cy="92" r="5.5" fill="#FFD98C"/>
    <circle cx="100" cy="74" r="4" fill="#E8A24B" opacity="0.9"/>
    <circle cx="124" cy="48" r="6" fill="#FFD98C"/>
    <circle cx="139" cy="42" r="3.5" fill="#FFE9B8" opacity="0.9"/>
    <path d="M104 56 L105 60.5 L109.5 61.5 L105 62.5 L104 67 L103 62.5 L98.5 61.5 L103 60.5 Z" fill="#FFE9B8"/>
    <circle cx="66" cy="142" r="2" fill="#D98E2B" opacity="0.7"/>
    <circle cx="142" cy="66" r="1.8" fill="#D98E2B" opacity="0.7"/>
    <rect x="0" y="0" width="176" height="176" rx="40" fill="none" stroke="#FFF9E8" stroke-width="5"/>
  </g>

<!-- constellation path -->
  <path d="M 772 318 C 832 322 858 300 908 280"
        fill="none" stroke="url(#pathGrad)" stroke-width="8" stroke-linecap="round" opacity="0.4" filter="url(#softGlow)"/>
  <path d="M 772 318 C 832 322 858 300 908 280"
        fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- path nodes -->
  <g>
    <circle cx="830" cy="308" r="10" fill="#E8954C" opacity="0.2"/>
    <circle cx="830" cy="308" r="5.5" fill="#FFF9E8" stroke="#2B2620" stroke-width="2.5"/>
    <circle cx="830" cy="308" r="1.8" fill="#D98E2B"/>
    <circle cx="908" cy="280" r="10" fill="#E8954C" opacity="0.2"/>
    <circle cx="908" cy="280" r="5.5" fill="#FFF9E8" stroke="#2B2620" stroke-width="2.5"/>
    <circle cx="908" cy="280" r="1.8" fill="#D98E2B"/>
  </g>

  <!-- footprints -->
  <g fill="#D98E2B" opacity="0.5">
    <ellipse cx="798" cy="318" rx="6" ry="2.8" transform="rotate(-8 798 318)"/>
    <ellipse cx="812" cy="314" rx="6" ry="2.8" transform="rotate(-8 812 314)"/>
    <ellipse cx="848" cy="308" rx="6" ry="2.8" transform="rotate(-7 848 308)"/>
    <ellipse cx="862" cy="303" rx="6" ry="2.8" transform="rotate(-7 862 303)"/>
  </g>

  <!-- glow orb -->
  <circle cx="756" cy="300" r="48" fill="#F0C75F" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="756" cy="300" r="22" fill="#F0C75F" opacity="0.55"/>
  <circle cx="756" cy="300" r="14" fill="#F6C85F" stroke="#2B2620" stroke-width="3.5"/>
  <circle cx="756" cy="300" r="5" fill="#FFF9E8"/>

  <!-- title block: Chinese line above English line -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="60" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13.5" font-weight="700" letter-spacing="2" fill="#A97A3B">NIGHT WALK · FIVE SENSORS · ONE GLOW</text>
    <text x="52" y="126" font-size="74" font-weight="850" letter-spacing="-1.5" fill="#2B2620">GloWalk</text>
    <rect x="54" y="138" width="230" height="11" rx="5.5" fill="#F0C75F" opacity="0.9"/>
    <text x="56" y="182" font-size="28" font-weight="700" fill="#B26B24">随行路灯</text>
    <text x="56" y="214" font-size="28" font-weight="700" fill="#B26B24">Path of Light</text>
    <text x="56" y="250" font-size="19" font-weight="520" fill="#6B6255">会读懂夜晚的智能手电筒</text>
    <text x="56" y="280" font-size="18" fill="#6B6255">A smart flashlight that reads the night</text>
    <text x="56" y="312" font-size="14.5" fill="#8A8070">步行记录同步至 Apple 健康</text>
    <text x="56" y="334" font-size="14.5" fill="#8A8070">Walk records sync to Apple Health</text>
  </g>

  <!-- flow diagram -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <circle cx="64" cy="392" r="9" fill="#E8954C" stroke="#2B2620" stroke-width="3"/>
    <text x="82" y="397" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">SENSORS</text>
    <line x1="160" y1="392" x2="194" y2="392" stroke="#2B2620" stroke-width="2"/>
    <path d="M192 386 L200 392 L192 398 Z" fill="#2B2620"/>
    <circle cx="212" cy="392" r="9" fill="#E8A24B" stroke="#2B2620" stroke-width="3"/>
    <text x="230" y="397" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">PATH</text>
    <line x1="286" y1="392" x2="320" y2="392" stroke="#2B2620" stroke-width="2"/>
    <path d="M318 386 L326 392 L318 398 Z" fill="#2B2620"/>
    <circle cx="338" cy="392" r="9" fill="#F6C85F" stroke="#2B2620" stroke-width="3"/>
    <text x="356" y="397" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6F5F">POSTER</text>
  </g>
</svg>
